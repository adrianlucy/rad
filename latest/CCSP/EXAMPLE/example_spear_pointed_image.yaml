%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-1.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/CCSP/EXAMPLE/example_spear_pointed_image-1.0.0

title: Example SPEAR pointed image CCSP product

datamodel_name: ExampleSpearPointedImageModel

type: object
properties:
  meta:
    allOf:
      - $ref: asdf://stsci.edu/datamodels/roman/schemas/CCSP/ccsp_custom_product-1.0.0
      - required:
          [
            exposure,
            instrument,
            telescope,
            target_coordinates,
            s_region,
            pixel_scale,
            wavelength,
          ]
      - type: object
        properties:
          wcs:
            title: World Coordinate System (WCS)
            description: |
              WCS for the data array and all concomitant arrays
            tag: tag:stsci.edu:gwcs/wcs-*
          aperture:
            title: Aperture
            description: |
              Slit shutter aperture mode
            type: string
          exposure:
            # Add more sub-keys to exposure, and modify exposure_time
            properties:
              exposure_time:
                title: Median exposure time (s) per slit width^2
              max_exposure_time:
                title: Max exposure time (s) per slit width^2
                type: number
                unit: "s"
              min_exposure_time:
                title: Min exposure time (s) per slit width^2
                type: number
                unit: "s"
              pixel_exposure_time:
                title: Median exposure time (s) per pixel
                type: number
                unit: "s"
            required: [
              exposure_time, 
              max_exposure_time, 
              min_exposure_time,
              pixel_exposure_time,
            ]
          grasp:
            title: Grasp (cm^-2 sr^-1) per exon at line wavelength
            type: number
            unit: "cm**-2.sr**-1"
          wavelength:
            # Add units to wavelength max and min
            properties:
              maximum:
                unit: "Angstrom"
              minimum:
                unit: "Angstrom"
        required: [wcs, aperture, grasp]
  data:
    title: Science Data (photon/(cm^2 s sr))
    description: |
      Integrated intensity in line units. Values with exposure time
      < 1 s/pix are set to NaN.
    tag: tag:stsci.edu:asdf/core/ndarray-1.*
    datatype: float32
    exact_datatype: true
    ndim: 2
    unit: "photon/(cm**2.s.sr)"
  count:
    title: Count (photon)
    description: |
      Continuum-subtracted photon count map.
    tag: tag:stsci.edu:asdf/core/ndarray-1.*
    datatype: float32
    exact_datatype: true
    ndim: 2
    unit: "photon"
  exp:
    title: Exposure Map (s)
    description: |
      Exposure time map. Array values correspond to net exposure time
      in pixel.
    tag: tag:stsci.edu:asdf/core/ndarray-1.*
    datatype: float32
    exact_datatype: true
    ndim: 2
    unit: "s"
required: [data, count, exp, meta]
flowStyle: block
